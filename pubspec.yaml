name: modiratsokhtandestelam
description: "سامانه جامع مدیریت هوشمند سوخت خودرو، استعلام و پرداخت خلافی و عوارض، خدمات بیمه و یادآور سرویس"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.6
  http: ^1.6.0
  crypto: ^3.0.7
  intl: ^0.20.2
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  local_auth: 2.3.0
  flutter_local_notifications: 19.5.0
  pdf: 3.12.0
  printing: 5.14.3
  image_picker: 1.0.8
  animations: ^3.0.0

dependency_overrides:
  local_auth_android: 1.0.52
  image_picker_android: 0.8.12+13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Light.ttf
          weight: 300
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
