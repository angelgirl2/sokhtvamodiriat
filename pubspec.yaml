name: sookht_man
version: 2.0.0+1
description: >-
  مدیریت سوخت و استعلام خودرو - بازنویسی کامل Flutter با رابط گلس مورفیسم، ذخیره‌سازی محلی،
  همگام‌سازی Railway و ارسال مرکزی درخواست‌های بله.
publish_to: 'none'

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  fl_chart: ^1.2.0
  image_picker: ^1.2.3
  local_auth: ^3.0.2
  url_launcher: ^6.3.2
  share_plus: ^13.3.1
  pdf: ^3.13.1
  printing: ^5.15.1
  excel: ^4.0.6
  crypto: ^3.0.6
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_logo.png

